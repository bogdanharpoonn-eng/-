<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — buro 3.12</title>
<link rel="icon" href="img/logo-on-light.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=10">
</head>
<body class="page">

<header class="site-header is-solid">
  <a class="brand" href="index.html" aria-label="buro 3.12">
    <img src="img/logo-on-light.svg" alt="buro 3.12">
  </a>
  <nav class="nav-text">
    <a href="portfolio.html">Portfolio</a>
    <a href="about.html">About</a>
    <a href="services.html">Service</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<main class="page-screen">
  <section class="journal">
    <p class="journal-side">Contact</p>
    <div class="journal-inner">
      <h1 class="page-title">Почати проєкт</h1>
      <p class="lead">Напишіть параметри приміщення. Архітектор відповість і запропонує наступний крок.</p>

      <div class="inquiry">
        <article>
          <h2>Email</h2>
          <p><a href="mailto:project@buro312.com">project@buro312.com</a></p>
        </article>
        <article>
          <h2>Київ · Дніпро</h2>
          <p>Україна</p>
        </article>
      </div>

      <form id="brief">
        <div>
          <label for="name">Ім’я / компанія *</label>
          <input id="name" name="name" required>
        </div>
        <div class="row-2">
          <div>
            <label for="type">Тип об’єкта</label>
            <select id="type" name="type">
              <option>Ресторан / бар</option>
              <option>Рітейл / шоурум</option>
              <option>Офіс</option>
              <option>Готель</option>
              <option>Інше</option>
            </select>
          </div>
          <div>
            <label for="area">Площа, м²</label>
            <input id="area" name="area" type="number">
          </div>
        </div>
        <div>
          <label for="how">Телефон або Telegram *</label>
          <input id="how" name="how" required>
        </div>
        <div>
          <label for="note">Місто, стадія, терміни</label>
          <textarea id="note" name="note"></textarea>
        </div>
        <button class="btn" type="submit">Send</button>
        <p class="form-note">Заявка відкриє лист на пошту бюро.</p>
      </form>
    </div>
  </section>
</main>

<footer class="site-foot">
  <span>buro 3.12</span>
  <span>Kyiv · Dnipro</span>
</footer>
<script src="js/site.js?v=10"></script>
</body>
</html>
